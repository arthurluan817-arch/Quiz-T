<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desafio da Informática</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121c31;
      --card-2: #182540;
      --text: #eef4ff;
      --muted: #9fb0cc;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --ok: #22c55e;
      --bad: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.14), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.14), transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .progress-wrap {
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s ease;
    }

    .question-title {
      font-size: 1.2rem;
      line-height: 1.45;
      margin: 0 0 8px;
    }

    .question-hint {
      font-size: 0.88rem;
      color: var(--accent);
      margin: 0 0 18px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.16);
    }

    .option-btn.correct {
      border-color: var(--ok);
      background: rgba(34, 197, 94, 0.18);
    }

    .option-btn.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.18);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.94rem;
      line-height: 1.45;
      display: none;
    }

    .feedback.ok {
      display: block;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
    }

    .feedback.bad {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #061021;
    }

    .btn-secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result-box {
      text-align: center;
      display: none;
    }

    .score-big {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0;
    }

    .summary-list {
      text-align: left;
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .summary-item {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      font-size: 0.92rem;
    }

    .summary-item.ok {
      border-left: 4px solid var(--ok);
    }

    .summary-item.bad {
      border-left: 4px solid var(--bad);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Quiz Interativo</div>
      <h1>Desafio da Informática</h1>
      <p class="subtitle">Teste seus conhecimentos sobre hardware, redes e tecnologia.</p>
    </header>

    <main class="card">
      <div id="quiz-view">
        <div class="progress-wrap">
          <div class="progress-info">
            <span id="q-counter">Questão 1 de 10</span>
            <span id="score-live">Acertos: 0</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <h2 class="question-title" id="q-text"></h2>
        <p class="question-hint" id="q-hint"></p>

        <div class="options" id="options-box"></div>

        <div class="feedback" id="feedback-box"></div>

        <div class="actions">
          <button class="btn btn-secondary" id="check-btn" disabled>Confirmar resposta</button>
          <button class="btn btn-primary" id="next-btn" disabled>Próxima</button>
        </div>
      </div>

      <div class="result-box" id="result-view">
        <h2>Resultado Final</h2>
        <div class="score-big" id="final-score">0 / 10</div>
        <p class="subtitle" id="final-message"></p>

        <div class="summary-list" id="summary-list"></div>

        <div class="actions" style="justify-content: center;">
          <button class="btn btn-primary" id="restart-btn">Jogar novamente</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        type: "single",
        question: "1. Qual componente é considerado o cérebro do computador?",
        options: [
          { key: "A", label: "Teclado" },
          { key: "B", label: "Monitor" },
          { key: "C", label: "Processador (CPU)" },
          { key: "D", label: "Mouse" }
        ],
        correct: ["C"],
        explanation: "O processador (CPU) executa as instruções e coordena o processamento de dados do computador."
      },
      {
        id: 2,
        type: "single",
        question: "2. Qual é a principal função da memória RAM?",
        options: [
          { key: "A", label: "Guardar temporariamente dados em uso" },
          { key: "B", label: "Exibir imagens" },
          { key: "C", label: "Conectar à internet" },
          { key: "D", label: "Armazenar arquivos para sempre" }
        ],
        correct: ["A"],
        explanation: "A memória RAM armazena temporariamente os dados e programas que estão em uso para acesso rápido."
      },
      {
        id: 3,
        type: "single",
        question: "3. Qual destes componentes é utilizado para armazenar arquivos e programas?",
        options: [
          { key: "A", label: "Cooler" },
          { key: "B", label: "HD ou SSD" },
          { key: "C", label: "Mouse" },
          { key: "D", label: "Monitor" }
        ],
        correct: ["B"],
        explanation: "HDs e SSDs são unidades de armazenamento onde ficam salvos o sistema operacional, programas e arquivos."
      },
      {
        id: 4,
        type: "single",
        question: "4. O teclado é um dispositivo de entrada de dados.",
        options: [
          { key: "V", label: "Verdadeiro" },
          { key: "F", label: "Falso" }
        ],
        correct: ["V"],
        explanation: "Verdadeiro: o teclado envia comandos e caracteres digitados pelo usuário para o computador."
      },
      {
        id: 5,
        type: "single",
        question: "5. Qual é a função da placa-mãe?",
        options: [
          { key: "A", label: "Imprimir documentos" },
          { key: "B", label: "Armazenar energia elétrica" },
          { key: "C", label: "Conectar os componentes do computador" },
          { key: "D", label: "Mostrar imagens na tela" }
        ],
        correct: ["C"],
        explanation: "A placa-mãe interliga CPU, memória, armazenamento e periféricos, permitindo a comunicação entre eles."
      },
      {
        id: 6,
        type: "single",
        question: "6. O que significa Wi-Fi?",
        options: [
          { key: "A", label: "Um tipo de teclado" },
          { key: "B", label: "Uma conexão de rede sem fio" },
          { key: "C", label: "Um programa de edição" },
          { key: "D", label: "Uma peça do processador" }
        ],
        correct: ["B"],
        explanation: "Wi-Fi é uma tecnologia de rede local sem fio que conecta dispositivos por ondas de rádio."
      },
      {
        id: 7,
        type: "single",
        question: "7. Qual equipamento é utilizado para distribuir a conexão de internet em uma rede?",
        options: [
          { key: "A", label: "Caixa de som" },
          { key: "B", label: "Roteador" },
          { key: "C", label: "Impressora" },
          { key: "D", label: "Scanner" }
        ],
        correct: ["B"],
        explanation: "O roteador gerencia e distribui o sinal de rede/internet entre os dispositivos conectados."
      },
      {
        id: 8,
        type: "multiple",
        question: "8. Quais destes são dispositivos de entrada de dados? Escolha todos os corretos.",
        options: [
          { key: "A", label: "Teclado" },
          { key: "B", label: "Microfone" },
          { key: "C", label: "Monitor" },
          { key: "D", label: "Mouse" }
        ],
        correct: ["A", "B", "D"],
        explanation: "Teclado, microfone e mouse enviam dados para o computador; o monitor é dispositivo de saída."
      },
      {
        id: 9,
        type: "single",
        question: "9. A internet e o Wi-Fi são exatamente a mesma coisa.",
        options: [
          { key: "V", label: "Verdadeiro" },
          { key: "F", label: "Falso" }
        ],
        correct: ["F"],
        explanation: "Falso: a internet é a rede mundial de computadores; o Wi-Fi é apenas uma forma sem fio de conectar à rede."
      },
      {
        id: 10,
        type: "single",
        question: "10. O que é um robô?",
        options: [
          { key: "A", label: "Um equipamento que só serve para jogar" },
          { key: "B", label: "Um tipo de monitor" },
          { key: "C", label: "Um cabo de computador" },
          { key: "D", label: "Uma máquina programada para executar tarefas" }
        ],
        correct: ["D"],
        explanation: "Um robô é uma máquina programável capaz de realizar ações ou tarefas de forma automatizada."
      }
    ];

    let currentIndex = 0;
    let selectedKeys = [];
    let checked = false;
    let score = 0;
    const history = [];

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const qCounter = document.getElementById("q-counter");
    const scoreLive = document.getElementById("score-live");
    const progressFill = document.getElementById("progress-fill");
    const qText = document.getElementById("q-text");
    const qHint = document.getElementById("q-hint");
    const optionsBox = document.getElementById("options-box");
    const feedbackBox = document.getElementById("feedback-box");
    const checkBtn = document.getElementById("check-btn");
    const nextBtn = document.getElementById("next-btn");
    const finalScore = document.getElementById("final-score");
    const finalMessage = document.getElementById("final-message");
    const summaryList = document.getElementById("summary-list");
    const restartBtn = document.getElementById("restart-btn");

    function arraysEqualSet(a, b) {
      if (a.length !== b.length) return false;
      const setA = new Set(a);
      return b.every((item) => setA.has(item));
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      selectedKeys = [];
      checked = false;

      qCounter.textContent = `Questão ${currentIndex + 1} de ${questions.length}`;
      scoreLive.textContent = `Acertos: ${score}`;
      progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;

      qText.textContent = q.question;
      qHint.textContent =
        q.type === "multiple"
          ? "Selecione uma ou mais opções corretas e clique em Confirmar resposta."
          : "Selecione a alternativa correta e clique em Confirmar resposta.";

      feedbackBox.className = "feedback";
      feedbackBox.textContent = "";
      checkBtn.disabled = true;
      nextBtn.disabled = true;
      nextBtn.textContent = currentIndex === questions.length - 1 ? "Ver resultado" : "Próxima";

      optionsBox.innerHTML = "";
      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.dataset.key = opt.key;
        btn.innerHTML = `<strong>${opt.key}.</strong> <span>${opt.label}</span>`;
        btn.addEventListener("click", () => toggleOption(opt.key));
        optionsBox.appendChild(btn);
      });
    }

    function toggleOption(key) {
      if (checked) return;
      const q = questions[currentIndex];

      if (q.type === "single") {
        selectedKeys = [key];
      } else {
        if (selectedKeys.includes(key)) {
          selectedKeys = selectedKeys.filter((k) => k !== key);
        } else {
          selectedKeys.push(key);
        }
      }

      const buttons = optionsBox.querySelectorAll(".option-btn");
      buttons.forEach((btn) => {
        btn.classList.toggle("selected", selectedKeys.includes(btn.dataset.key));
      });

      checkBtn.disabled = selectedKeys.length === 0;
    }

    function checkAnswer() {
      if (checked || selectedKeys.length === 0) return;
      checked = true;

      const q = questions[currentIndex];
      const isRight = arraysEqualSet(selectedKeys, q.correct);

      if (isRight) {
        score += 1;
        scoreLive.textContent = `Acertos: ${score}`;
      }

      const buttons = optionsBox.querySelectorAll(".option-btn");
      buttons.forEach((btn) => {
        const key = btn.dataset.key;
        btn.disabled = true;
        btn.classList.remove("selected");

        if (q.correct.includes(key)) {
          btn.classList.add("correct");
        } else if (selectedKeys.includes(key)) {
          btn.classList.add("wrong");
        }
      });

      feedbackBox.className = `feedback ${isRight ? "ok" : "bad"}`;
      feedbackBox.textContent = `${isRight ? "Correto!" : "Incorreto."} ${q.explanation}`;

      history.push({
        question: q.question,
        selected: [...selectedKeys],
        correct: [...q.correct],
        isRight
      });

      checkBtn.disabled = true;
      nextBtn.disabled = false;
    }

    function nextQuestion() {
      if (!checked) return;
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      progressFill.style.width = "100%";
      quizView.style.display = "none";
      resultView.style.display = "block";

      finalScore.textContent = `${score} / ${questions.length}`;

      if (score === 10) {
        finalMessage.textContent = "Excelente! Você gabaritou o Desafio da Informática!";
      } else if (score >= 7) {
        finalMessage.textContent = "Muito bem! Você manda bem nos fundamentos de informática.";
      } else if (score >= 4) {
        finalMessage.textContent = "Bom começo! Dá para subir ainda mais essa pontuação.";
      } else {
        finalMessage.textContent = "Continue praticando! Veja o resumo abaixo e tente novamente.";
      }

      summaryList.innerHTML = "";
      history.forEach((item) => {
        const div = document.createElement("div");
        div.className = `summary-item ${item.isRight ? "ok" : "bad"}`;
        div.innerHTML = `
          <div><strong>${item.question}</strong></div>
          <div>Sua resposta: ${item.selected.join(", ")} | Gabarito: ${item.correct.join(", ")}</div>
        `;
        summaryList.appendChild(div);
      });
    }

    function restartQuiz() {
      currentIndex = 0;
      selectedKeys = [];
      checked = false;
      score = 0;
      history.length = 0;
      resultView.style.display = "none";
      quizView.style.display = "block";
      renderQuestion();
    }

    checkBtn.addEventListener("click", checkAnswer);
    nextBtn.addEventListener("click", nextQuestion);
    restartBtn.addEventListener("click", restartQuiz);

    renderQuestion();
  </script>
</body>
</html>
